<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Fest Pilot — intelligent college fest planning</title>
  <desc id="desc">A warm ivory and vivid orange landing page for a college festival planning app.</desc>
  <defs>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff4c12"/><stop offset=".53" stop-color="#fa3212"/><stop offset="1" stop-color="#240c08"/>
    </linearGradient>
    <radialGradient id="orb"><stop stop-color="#ffbf76"/><stop offset="1" stop-color="#ff5317" stop-opacity="0"/></radialGradient>
    <filter id="shadow" x="-.3" y="-.3" width="1.6" height="1.6"><feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#a63110" flood-opacity=".17"/></filter>
  </defs>
  <rect width="1600" height="1000" fill="#f4f1e9"/>
  <rect x="0" y="0" width="1600" height="79" fill="#f8f6f0"/>
  <path d="M0 78H1600" stroke="#e5e1d8"/>
  <rect x="18" y="23" width="38" height="38" rx="12" fill="#ff4b18" filter="url(#shadow)"/>
  <text x="37" y="49" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="800" fill="white">F</text>
  <text x="68" y="49" font-family="Arial,sans-serif" font-size="23" font-weight="800" fill="#191919">Fest<tspan fill="#ff4b18"> • </tspan>Pilot</text>
  <rect x="470" y="18" width="106" height="45" rx="13" fill="#171717"/>
  <text x="523" y="46" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="white">Overview</text>
  <g font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#686760">
    <text x="635" y="46">Planner</text><text x="760" y="46">Your plans</text><text x="900" y="46">Features</text><text x="1042" y="46">How it works</text>
  </g>
  <rect x="1383" y="17" width="190" height="47" rx="14" fill="#181818"/>
  <text x="1478" y="46" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="white">Open planner ↗</text>
  <path d="M0 80H1600V735Q1600 780 1553 780H47Q0 780 0 735Z" fill="url(#hero)"/>
  <circle cx="1017" cy="347" r="218" fill="url(#orb)" opacity=".8"/>
  <circle cx="893" cy="490" r="110" fill="url(#orb)" opacity=".65"/>
  <g font-family="Arial,sans-serif">
    <text x="230" y="132" font-size="13" font-weight="800" letter-spacing="3" fill="#fff">INTELLIGENT COLLEGE FEST PLANNING</text>
    <text x="230" y="238" font-size="86" font-weight="800" letter-spacing="-5" fill="#fff">Build a</text>
    <text x="230" y="322" font-size="86" font-weight="800" letter-spacing="-5" fill="#17100d">better fest.</text>
    <text x="230" y="406" font-size="83" font-weight="800" letter-spacing="-5" fill="#fff">without the</text>
    <text x="230" y="490" font-size="83" font-weight="800" letter-spacing="-5" fill="#fff">planning chaos.</text>
    <text x="1090" y="327" font-size="21" font-weight="800" fill="#fff">Plan. Validate. Launch.</text>
    <text x="1090" y="363" font-size="16" fill="#ffe9df">Turn fest documents into a</text>
    <text x="1090" y="388" font-size="16" fill="#ffe9df">conflict-free, budget-aware event</text>
    <text x="1090" y="413" font-size="16" fill="#ffe9df">plan with AI assistance.</text>
  </g>
  <path d="M230 610H1368" stroke="#ffffff" stroke-opacity=".32"/>
  <g font-family="Arial,sans-serif" fill="#fff">
    <g><text x="230" y="638" font-size="13" font-weight="800">01</text><text x="230" y="662" font-size="14">Upload your inputs</text></g>
    <g><text x="510" y="638" font-size="13" font-weight="800">02</text><text x="510" y="662" font-size="14">Extract the rules</text></g>
    <g><text x="790" y="638" font-size="13" font-weight="800">03</text><text x="790" y="662" font-size="14">Build the schedule</text></g>
    <g><text x="1070" y="638" font-size="13" font-weight="800">04</text><text x="1070" y="662" font-size="14">Validate</text></g>
  </g>
  <rect y="780" width="1600" height="58" rx="20" fill="#171918"/>
  <g font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="1.2" fill="#e8e5de">
    <text x="40" y="815">✦  CONFLICT CHECKING</text><text x="310" y="815">✦  RESOURCE PLANNING</text><text x="590" y="815">✦  AI RECOMMENDATIONS</text><text x="890" y="815">✦  VENUE MATCHING</text><text x="1145" y="815">✦  BUDGET CONTROL</text>
  </g>
  <text x="230" y="908" font-family="Arial,sans-serif" font-size="12" font-weight="800" letter-spacing="2.5" fill="#ff4b18">WHAT THE PLANNER HANDLES</text>
  <text x="230" y="952" font-family="Arial,sans-serif" font-size="37" font-weight="800" letter-spacing="-1.5" fill="#181818">Less cross-checking. Better festivals.</text>
</svg>
